<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var supported = ["dark-orange", "dark-blue", "light-orange", "light-blue"];
        var params = new URLSearchParams(window.location.search);
        var theme = params.get("theme");
        if (!supported.includes(theme)) {
          theme = localStorage.getItem("principles-theme");
        }
        if (!supported.includes(theme)) {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light-orange"
            : "dark-orange";
        }
        document.documentElement.dataset.theme = theme;
        if (params.has("theme") && supported.includes(theme)) {
          localStorage.setItem("principles-theme", theme);
        }
      } catch (_) {}
    </script>
    <link rel="icon" type="image/png" href="/images/tabicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Principles helps you build better habits with daily actions, clear routines, and timely reminders. Available on Android and iOS."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Principles" />
    <title>Principles — Habits for Goals</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/principles-env.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
